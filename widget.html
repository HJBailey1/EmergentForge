<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Emergent Choirforge — Widget</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/tone/build/Tone.min.js"></script>
  </head>
  <body>
    <main>
      <canvas id="vis" width="720" height="160"></canvas>
      <section class="controls">
        <div class="row">
          <button id="playBtn">Play</button>
          <button id="stopBtn">Stop</button>
        </div>
        <div class="row sliders">
          <div class="ctrl"><label>Sanctify</label><input id="macroSanctify" type="range" min="0" max="1" step="0.01" value="0.1"></div>
          <div class="ctrl"><label>Pulse</label><input id="macroPulse" type="range" min="0" max="1" step="0.01" value="0.2"></div>
        </div>
      </section>
    </main>
    <script src="js/app.js"></script>
  </body>
</html>
